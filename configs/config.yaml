# ============================================================
# 生成模型实验配置 (AE / VAE / DDPM)
# 运行: python main.py  或  python main.py --config configs/config.yaml
# 临时切换模式: python main.py --mode infer
# ============================================================

# ---------- 1. 数据集选择: 从下方 datasets 中任选一个名字 ----------
dataset: mnist                 # 可选: mnist / fashion / cifar10

datasets:                      # 所有可用数据集的定义
  mnist:                       # 手写数字 28x28 灰度, CPU 可训
    img_size: 28
    channels: 1
    classes: 10
  fashion:                     # 服饰 28x28 灰度, CPU 可训, 视觉效果更好
    img_size: 28
    channels: 1
    classes: 10
  cifar10:                     # 彩色物体 32x32, 建议有 GPU 时使用
    img_size: 32
    channels: 3
    classes: 10

# ---------- 2. 运行方式 ----------
run:
  mode: train                  # train=训练 / infer=推理(生成样本)
  model: vae                   # ae / vae / ddpm
  seed: 42
  device: auto                 # auto / cpu / cuda

# ---------- 3. 训练超参数 (三个模型通用) ----------
train:
  batch_size: 128
  lr: 2.0e-4
  epochs: 20                   # 默认轮数, 可被 model.<name>.epochs 覆盖
  num_workers: 0               # Windows 下建议 0, Linux 可设 4
  log_every: 200               # 每多少个 iteration 刷新一次进度条日志
  vis_every: 5                 # 每多少个 epoch 保存一次可视化

# ---------- 4. 推理配置 ----------
infer:
  checkpoint: ""               # 留空 = 自动使用 outputs/<model>/<dataset>/model.pt
  n_samples: 16                # 生成样本数量
  sampler: ddim                # ddpm=完整 1000 步 / ddim=加速采样 (仅 ddpm 用)
  ddim_steps: 50               # ddim 采样步数
  n_vis_steps: 8               # 去噪过程可视化记录的帧数 (仅 ddpm 用)
  digits: []                   # CVAE 指定生成的数字, 留空=10 类各一行; 也可命令行 --digits 3,7

# ---------- 5. 各模型超参数 ----------
model:
  ae:
    latent_dim: 128
    epochs: 15
  vae:
    latent_dim: 128
    kld_weight: 1.0            # KL 散度权重: 调小 -> 重构更清晰但采样更差 (beta-VAE)
    epochs: 20
  cvae:                        # 条件 VAE: 指定数字生成对应图片
    latent_dim: 16             # 隐空间必须收紧(16 维), 否则类别信息会从 z 绕过标签
    kld_weight: 4.0            # 大于 1 的 KL 权重把 z 压向先验, 条件生成更干净(已验证)
    epochs: 20
  ddpm:
    timesteps: 1000            # 加噪总步数 T
    beta_start: 1.0e-4         # 线性噪声调度
    beta_end: 0.02
    base_channels: 64          # UNet 基础通道数, CPU 训练慢可降到 32
    mult: [1, 2, 4]            # 各层级通道倍率
    ema_decay: 0.999           # EMA 平滑系数
    epochs: 30
